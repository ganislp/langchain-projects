[project]
name = "langchin-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ganislp", email = "ganislp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "ddgs>=9.5.2",
    "docling[vlm]>=2.57.0",
    "docx2txt>=0.9",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.12.0",
    "greenlet>=3.5.6",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "langchain>=1.0.0",
    "langchain-community>=0.4",
    "langchain-core>=1.0.0",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langsmith>=0.4.37",
    "lxml>=5.4.0",
    "markitdown[all]>=0.0.2",
    "nltk>=3.9.2",
    "numpy>=2.2.6",
    "ollama>=0.6.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.12.3",
    "pymupdf>=1.26.5",
    "pymysql>=1.1.2",
    "python-dotenv>=1.1.1",
    "python-pptx>=1.0.2",
    "selenium>=4.37.0",
    "streamlit>=1.50.0",
    "tiktoken>=0.12.0",
    "typing-extensions>=4.15.0",
]

[project.scripts]
langchin-chatbot = "langchin_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
