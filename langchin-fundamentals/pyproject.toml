[project]
name = "langchain-and-ollama-fundamentals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ganislp", email = "ganislp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.2",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.3",
